set timeout=1
set default=zxs-normal
terminal_input console
terminal_output console
search --no-floppy --fs-uuid --set=root @ROOT_FSUUID@
if [ -f /boot/grub/grubenv ]; then
    load_env -f /boot/grub/grubenv next_entry
    if [ "$next_entry" = zxs-recovery ]; then
        set default=zxs-recovery
        set next_entry=
        save_env -f /boot/grub/grubenv next_entry
    fi
fi
menuentry 'ZXS Debian minimal' --id zxs-normal {
    linux /vmlinuz root=PARTUUID=@ROOT_PARTUUID@ rootfstype=ext4 rootwait rw console=tty1 ipv6.disable=1 8250.nr_uarts=0 i8042.nokbd i8042.noaux
    initrd /initrd.img
}
if [ -f /boot/zxs-recovery/current/kernel -a -f /boot/zxs-recovery/current/initrd ]; then
    menuentry 'ZXS preserved kernel and drivers' --id zxs-recovery {
        linux /boot/zxs-recovery/current/kernel root=PARTUUID=@ROOT_PARTUUID@ rootfstype=ext4 rootwait rw console=tty1 ipv6.disable=1 8250.nr_uarts=0 i8042.nokbd i8042.noaux zxs.recovery=1
        initrd /boot/zxs-recovery/current/initrd
    }
fi
menuentry 'ZXS current kernel - local rescue' --id zxs-rescue {
    linux /vmlinuz root=PARTUUID=@ROOT_PARTUUID@ rootfstype=ext4 rootwait rw console=tty1 ipv6.disable=1 8250.nr_uarts=0 i8042.nokbd i8042.noaux systemd.unit=rescue.target
    initrd /initrd.img
}
