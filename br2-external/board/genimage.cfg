image efi-part.vfat {
    vfat {
        file EFI { image = "efi-part/EFI" }
        file bzImage { image = "bzImage" }
    }
    size = 64M
}
image disk.img {
    hdimage { partition-table-type = "gpt" }
    partition boot {
        image = "efi-part.vfat"
        partition-type-uuid = U
        offset = 1M
        bootable = true
    }
    partition root {
        image = "rootfs.ext2"
        partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
        partition-uuid = 4d6a788b-e38d-41ef-8f60-f7594f08c402
    }
}

