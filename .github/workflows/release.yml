name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check version tag
        shell: bash
        run: |
          set -euo pipefail
          [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          [[ $(git rev-parse "refs/tags/$RELEASE_TAG^{commit}") == "$(git rev-parse HEAD)" ]]
      - name: Make room on the disposable hosted runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - name: Restore compatible build and download cache
        id: build-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .cache/
            .work/output/
          key: ${{ runner.os }}-zxs-${{ hashFiles('build.sh', 'scripts/setup-host.sh', 'br2-external/configs/zxs_x86_64_defconfig', 'br2-external/board/linux.fragment', 'br2-external/board/busybox.fragment') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-zxs-${{ hashFiles('build.sh', 'scripts/setup-host.sh', 'br2-external/configs/zxs_x86_64_defconfig', 'br2-external/board/linux.fragment', 'br2-external/board/busybox.fragment') }}-
      - name: Prepare Debian 13 builder
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          build_context=$(mktemp -d)
          trap 'rm -rf -- "$build_context"' EXIT
          cat > "$build_context/Dockerfile" <<'DOCKERFILE'
          FROM debian:13-slim
          ARG BUILD_UID=1001
          ARG BUILD_GID=1001
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install --assume-yes --no-install-recommends \
              build-essential ca-certificates curl file git gnupg patch perl python3 unzip wget xz-utils \
              && rm -rf /var/lib/apt/lists/*
          RUN (getent group "$BUILD_GID" >/dev/null || groupadd --gid "$BUILD_GID" builder) \
              && useradd --uid "$BUILD_UID" --gid "$BUILD_GID" --create-home builder
          WORKDIR /src
          USER builder
          DOCKERFILE
          docker build --build-arg BUILD_UID="$(id -u)" --build-arg BUILD_GID="$(id -g)" \
            --tag zxs-builder "$build_context"
          docker run --rm --volume "$PWD:/src" --env JOBS=4 zxs-builder ./build.sh setup
      - name: Compile kernel and system image
        run: docker run --rm --volume "$PWD:/src" --env JOBS=4 zxs-builder ./build.sh build
      - name: Verify boot media and required capabilities
        run: docker run --rm --volume "$PWD:/src" --env JOBS=4 zxs-builder ./build.sh verify
      - name: Test two UEFI boots and delayed udev coldplug recovery
        run: docker run --rm --volume "$PWD:/src" --env JOBS=4 zxs-builder ./build.sh test
      - name: Package validated artifacts and complete corresponding sources
        run: |
          docker run --rm --volume "$PWD:/src" --env JOBS=4 zxs-builder \
            bash -Eeuo pipefail -c './build.sh package && ./build.sh legal-info'
      - name: Save reusable compilation even if a later check fails
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .cache/
            .work/output/
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Keep verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/zxs-linux-amd64/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Keep build and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-logs
          path: |
            .work/logs/
            .work/results/
            .work/boot-test/*.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist/zxs-linux-amd64/
      - name: Publish only after validation and all uploads succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh "$RELEASE_TAG"
