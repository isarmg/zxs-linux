name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check version tag
        shell: bash
        run: |
          set -euo pipefail
          [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          [[ $(git rev-parse "refs/tags/$RELEASE_TAG^{commit}") == "$(git rev-parse HEAD)" ]]
      - name: Make room on the disposable hosted runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - name: Build and test in Debian 13
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/src" --workdir /src \
            --env JOBS=4 --env BUILD_UID="$(id -u)" --env BUILD_GID="$(id -g)" \
            debian:13-slim bash -Eeuo pipefail -c '
              apt-get update
              apt-get install --assume-yes --no-install-recommends \
                build-essential ca-certificates curl file git gnupg patch perl python3 unzip wget xz-utils
              getent group "$BUILD_GID" >/dev/null || groupadd --gid "$BUILD_GID" builder
              useradd --uid "$BUILD_UID" --gid "$BUILD_GID" --create-home builder
              chown -R "$BUILD_UID:$BUILD_GID" /src
              runuser -u builder -- bash -Eeuo pipefail -c "./build.sh all && ./build.sh legal-info"
            '
      - name: Keep verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/zxs-linux-amd64/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Keep build and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-logs
          path: |
            .work/logs/
            .work/results/
            .work/boot-test/*.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist/zxs-linux-amd64/
      - name: Publish only after validation and all uploads succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh "$RELEASE_TAG"
