name: Supplement existing release toolchain sources

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to supplement
        required: true
        type: string

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Collect and verify all SDK source and license files
        run: python3 scripts/toolchain-sources.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolchain-sources
          path: dist/toolchain-sources/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  upload:
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: toolchain-sources
          path: sources
      - name: Verify and attach supplement after the system release is published
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd sources
          sha256sum --check --strict toolchain-source-licenses.SHA256SUMS
          ready=false
          for ((attempt=0; attempt<150; attempt++)); do
            if [[ $(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null) == false ]]; then
              ready=true
              break
            fi
            sleep 40
          done
          [[ $ready == true ]] || { echo 'The system release was not published within the waiting period.' >&2; exit 1; }
          gh release upload "$RELEASE_TAG" toolchain-source-licenses.tar.gz toolchain-source-licenses.SHA256SUMS
